<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | كنوز الحقول</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
:root{--bg:#fff8ec;--card:#fff;--fg:#23211f;--muted:#6b645c;--line:#efdcbc;--gold:#f78502;--gold-d:#b25a00;--ok:#1b7a43;--bad:#b3261e;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--gold-d)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;width:min(380px,100%);display:grid;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.login h1{margin:0;font-size:22px}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.top h1{font-size:17px;margin:0;flex:1}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;max-width:1200px;margin:18px auto;padding:0 16px}
.tabs{display:grid;gap:6px;align-content:start;position:sticky;top:70px}
.tabs button{text-align:start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px}
.panel h2{margin:0;font-size:19px}
.panel h3{margin:6px 0 0;font-size:16px}
.hint{color:var(--muted);font-size:13px;margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field{display:grid;gap:5px;font-weight:600;font-size:14px}
.field small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=url],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.ltr{direction:ltr;text-align:start}
.btn{border:0;border-radius:999px;padding:10px 20px;background:var(--gold);color:#23211f;font-weight:700;cursor:pointer}
.btn:hover{background:var(--gold-d)}
.btn.ghost{background:#fff;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:#f3ecdf}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #efc9c6}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.savebar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.savebar .msg{color:var(--muted);font-size:13px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.item.off{opacity:.55}
.thumb{width:64px;height:64px;border-radius:10px;background:#efe9de center/cover no-repeat;border:1px solid var(--line)}
.item b{display:block}
.item .sub{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:#efe9de;margin-inline-start:6px;font-weight:600}
.badge.off{background:#f6d9d6;color:var(--bad)}
.badge.ok{background:#d9f0e2;color:var(--ok)}
.warn{background:#fff6dd;border:1px solid #f0dc9b;border-radius:12px;padding:10px 14px;font-size:13.5px}
.err{background:#fdeceb;border:1px solid #efc9c6;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:13.5px}
.pays{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pays label{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.pays label small{color:var(--muted);font-weight:400;font-size:12px}
dialog{border:0;border-radius:var(--r);padding:0;width:min(720px,calc(100% - 24px));max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(23,21,20,.55)}
dialog form{padding:20px;display:grid;gap:14px}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgs .im{position:relative;width:90px;height:90px;border-radius:10px;border:1px solid var(--line);background:#efe9de center/cover}
.imgs .im button{position:absolute;top:3px;inset-inline-start:3px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.imgs .im em{position:absolute;bottom:3px;inset-inline-end:3px;background:var(--gold);color:#23211f;font-size:10px;border-radius:6px;padding:0 5px;font-style:normal}
.add-img{width:90px;height:90px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;background:#fff}
.bi{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center}
.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--fg);color:#fff;padding:10px 18px;border-radius:999px;z-index:100;font-weight:600}
.toast.bad{background:var(--bad)}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .tabs{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;position:static;padding-bottom:4px}
  .grid2,.grid3{grid-template-columns:1fr}
  .item{grid-template-columns:52px minmax(0,1fr)}
  .item .acts{grid-column:1/-1}
  .thumb{width:52px;height:52px}
}
</style>
</head>
<body>

<div class="login" id="loginView" hidden>
  <form id="loginForm">
    <h1>لوحة تحكم كنوز الحقول</h1>
    <p class="hint">سجّل الدخول لإدارة المتجر والمنتجات وبيانات الشركة.</p>
    <label class="field">اسم المستخدم<input type="text" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required autofocus></label>`n    <label class="field">كلمة المرور<input type="password" id="loginPass" autocomplete="current-password" dir="ltr" required></label>
    <div class="err" id="loginErr" hidden></div>
    <button class="btn" type="submit">دخول</button>
  </form>
</div>

<div id="appView" hidden>
  <div class="top">
    <h1>لوحة التحكم</h1>
    <a class="btn ghost sm" href="/" target="_blank" rel="noopener" style="text-decoration:none">عرض الموقع</a>
    <button class="btn ghost sm" id="logoutBtn" type="button">تسجيل الخروج</button>
  </div>
  <div class="shell">
    <nav class="tabs" id="tabs"></nav>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ERR = { unauthorized: 'انتهت الجلسة، سجّل الدخول مجددًا', invalid_credentials: 'اسم المستخدم أو كلمة المرور غير صحيحة', rate_limited: 'محاولات كثيرة، حاول بعد قليل', payload_too_large: 'الملف كبير جدًا', no_gateway_key: 'لا يوجد مفتاح محفوظ', database_required: 'يلزم ربط قاعدة البيانات أولًا', invalid_status: 'حالة غير صحيحة', not_found: 'غير موجود' };

let D = null;           // data from the server
let tab = 'site';
let dirty = false;
let draft = {};         // working copies of list sections

const TABS = [
  ['site', 'بيانات الشركة'],
  ['home', 'الصفحة الرئيسية'],
  ['products', 'المنتجات'],
  ['categories', 'الأقسام'],
  ['bundles', 'الباقات'],
  ['payments', 'الدفع والشحن'],
  ['gateway', 'بوابة الدفع'],
  ['orders', 'الطلبات'],
  ['security', 'الأمان']
];

const PAYMENTS = [
  ['bank', 'تحويل بنكي', 'يظهر للعميل رقم الحساب والآيبان من البيانات أدناه.'],
  ['cod', 'الدفع عند الاستلام', ''],
  ['later', 'الدفع بعد التأكيد', 'يتواصل فريقكم لإرسال رابط أو بيانات الدفع.'],
  ['mada', 'مدى', 'يُنفَّذ يدويًا (رابط دفع عبر واتساب) حتى يتم ربط بوابة دفع.'],
  ['card', 'فيزا / ماستركارد', 'يُنفَّذ يدويًا حتى يتم ربط بوابة دفع.'],
  ['apple', 'Apple Pay', 'يُنفَّذ يدويًا حتى يتم ربط بوابة دفع.'],
  ['stc', 'STC Pay', 'يُنفَّذ يدويًا حتى يتم ربط بوابة دفع.'],
  ['tabby', 'تابي', 'يُنفَّذ يدويًا حتى يتم ربط بوابة دفع.'],
  ['tamara', 'تمارا', 'يُنفَّذ يدويًا حتى يتم ربط بوابة دفع.']
];

/* ---------- helpers ---------- */
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 2600);
}

async function api(path, method = 'GET', body) {
  const res = await fetch(path, {
    method, credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch { /* empty body */ }
  if (res.status === 401 && path !== '/api/admin/login') { showLogin(); throw new Error(ERR.unauthorized); }
  if (!res.ok) throw new Error(data.message || ERR[data.error] || 'تعذّر تنفيذ العملية');
  return data;
}

const val = id => { const el = $('#' + id); return el ? el.value : ''; };
const chk = id => { const el = $('#' + id); return !!(el && el.checked); };
function field(label, id, value, o = {}) {
  const hint = o.hint ? `<small>${esc(o.hint)}</small>` : '';
  const cls = o.ltr ? ' class="ltr"' : '';
  if (o.area) return `<label class="field">${esc(label)}<textarea id="${id}" maxlength="${o.max || 600}"${cls}>${esc(value)}</textarea>${hint}</label>`;
  return `<label class="field">${esc(label)}<input id="${id}" type="${o.type || 'text'}" value="${esc(value)}"${o.step ? ` step="${o.step}"` : ''}${o.min != null ? ` min="${o.min}"` : ''}${cls}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}>${hint}</label>`;
}
const toggle = (id, label, on) => `<label class="toggle"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}>${esc(label)}</label>`;
const imgUrl = f => /^\//.test(f) ? f : `/img/${f}.webp`;
const thumbStyle = p => (p.images && p.images[0]) ? `background-image:url('${esc(imgUrl(p.images[0]))}')` : '';
const money = n => Number(n).toFixed(2);

function setDirty(v) { dirty = v; const m = $('#saveMsg'); if (m) m.textContent = v ? 'لديك تعديلات غير محفوظة' : 'كل التعديلات محفوظة'; }
function markDirty() { setDirty(true); }

function saveBar(label = 'حفظ التعديلات') {
  return `<div class="savebar"><button class="btn" id="saveBtn" type="button">${label}</button><span class="msg" id="saveMsg">${dirty ? 'لديك تعديلات غير محفوظة' : 'كل التعديلات محفوظة'}</span></div>`;
}

async function save(section, payload) {
  const btn = $('#saveBtn'); if (btn) btn.disabled = true;
  try {
    D = await api(`/api/admin/${section}`, 'PUT', payload);
    draft = {};
    setDirty(false);
    toast('تم الحفظ ✓ — التغيير ظاهر الآن في الموقع');
    return true;
  } catch (e) { toast(e.message, true); return false; }
  finally { if (btn) btn.disabled = false; }
}

/* ---------- views ---------- */
function showLogin() { $('#appView').hidden = true; $('#loginView').hidden = false; $('#loginPass').value = ''; }

async function boot() {
  try { D = await api('/api/admin/data'); } catch { showLogin(); return; }
  $('#loginView').hidden = true; $('#appView').hidden = false;
  render();
}

function render() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button type="button" data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('');
  const views = { site: vSite, home: vHome, products: vProducts, categories: vCategories, bundles: vBundles, payments: vPayments, gateway: vGateway, orders: vOrders, security: vSecurity };
  $('#main').innerHTML = views[tab]();
  if (tab === 'products') bindProducts();
  if (tab === 'categories') bindCategories();
  if (tab === 'bundles') bindBundles();
  if (tab === 'payments') bindPayments();
  if (tab === 'gateway') bindGateway();
  if (tab === 'orders') bindOrders();
  if (tab === 'site') bindSite();
  if (tab === 'home') bindHome();
  if (tab === 'security') bindSecurity();
  document.querySelectorAll('#main input, #main textarea, #main select').forEach(el => {
    if (el.type !== 'file') el.addEventListener('input', markDirty);
  });
}

/* ----- company ----- */
function vSite() {
  const s = D.site, so = s.social || {};
  return `<div class="panel"><h2>بيانات الشركة</h2>
  <p class="hint">تظهر في رأس الموقع وتذييله ورسائل واتساب. اترك أي حقل فارغًا لإخفائه.</p>
  <div class="grid2">${field('اسم المتجر (عربي)', 's_nameAr', s.nameAr)}${field('اسم المتجر (إنجليزي)', 's_nameEn', s.nameEn, { ltr: 1 })}
  ${field('وصف مختصر تحت الاسم (عربي)', 's_taglineAr', s.taglineAr)}${field('وصف مختصر (إنجليزي)', 's_taglineEn', s.taglineEn, { ltr: 1 })}</div>
  <div class="grid2">${field('نبذة عن الشركة (عربي)', 's_aboutAr', s.aboutAr, { area: 1 })}${field('نبذة عن الشركة (إنجليزي)', 's_aboutEn', s.aboutEn, { area: 1, ltr: 1 })}</div>
  <h3>التواصل</h3>
  <div class="grid3">${field('رقم واتساب لاستقبال الطلبات', 's_whatsapp', s.whatsapp, { ltr: 1, hint: 'بصيغة دولية بدون + مثل 201055782314 أو 966501234567' })}
  ${field('الهاتف', 's_phone', s.phone, { ltr: 1, type: 'tel' })}${field('البريد الإلكتروني', 's_email', s.email, { ltr: 1, type: 'email' })}</div>
  <div class="grid2">${field('العنوان (عربي)', 's_addressAr', s.addressAr, { area: 1, max: 250 })}${field('العنوان (إنجليزي)', 's_addressEn', s.addressEn, { area: 1, max: 250, ltr: 1 })}
  ${field('ساعات العمل (عربي)', 's_hoursAr', s.hoursAr, { ph: 'مثال: السبت - الخميس 9ص - 9م' })}${field('ساعات العمل (إنجليزي)', 's_hoursEn', s.hoursEn, { ltr: 1 })}</div>
  <h3>البيانات النظامية</h3>
  <div class="grid2">${field('السجل التجاري', 's_crNo', s.crNo, { ltr: 1 })}${field('الرقم الضريبي', 's_vatNo', s.vatNo, { ltr: 1 })}</div>
  <h3>روابط التواصل الاجتماعي</h3>
  <div class="grid3">${['instagram', 'x', 'snapchat', 'tiktok', 'facebook'].map(k => field({ instagram: 'إنستجرام', x: 'X (تويتر)', snapchat: 'سناب شات', tiktok: 'تيك توك', facebook: 'فيسبوك' }[k], 's_so_' + k, so[k], { ltr: 1, type: 'url', ph: 'https://' })).join('')}</div>
  </div>${saveBar()}`;
}
function bindSite() {
  $('#saveBtn').onclick = () => save('site', {
    nameAr: val('s_nameAr'), nameEn: val('s_nameEn'), taglineAr: val('s_taglineAr'), taglineEn: val('s_taglineEn'),
    aboutAr: val('s_aboutAr'), aboutEn: val('s_aboutEn'), whatsapp: val('s_whatsapp'), phone: val('s_phone'), email: val('s_email'),
    addressAr: val('s_addressAr'), addressEn: val('s_addressEn'), hoursAr: val('s_hoursAr'), hoursEn: val('s_hoursEn'),
    crNo: val('s_crNo'), vatNo: val('s_vatNo'),
    social: Object.fromEntries(['instagram', 'x', 'snapchat', 'tiktok', 'facebook'].map(k => [k, val('s_so_' + k)]))
  });
}

/* ----- home ----- */
function vHome() {
  const h = D.home;
  return `<div class="panel"><h2>الصفحة الرئيسية</h2>
  <p class="hint">اترك العنوان أو النص فارغًا لاستخدام النص الافتراضي للموقع.</p>
  <div class="grid2">${field('عنوان الهيرو (عربي)', 'h_tAr', h.heroTitleAr, { ph: 'منتجات غذائية مختارة — بأسعار واضحة وتشمل الضريبة' })}${field('عنوان الهيرو (إنجليزي)', 'h_tEn', h.heroTitleEn, { ltr: 1 })}
  ${field('النص تحت العنوان (عربي)', 'h_bAr', h.heroBlurbAr, { area: 1, max: 300 })}${field('النص تحت العنوان (إنجليزي)', 'h_bEn', h.heroBlurbEn, { area: 1, max: 300, ltr: 1 })}</div>
  <h3>الشريط الإعلاني أعلى الموقع</h3>
  ${toggle('h_on', 'إظهار الشريط الإعلاني', h.announceOn)}
  <div class="grid2">${field('نص الشريط (عربي)', 'h_aAr', h.announceAr, { ph: 'مثال: شحن مجاني للطلبات فوق 500 ر.س' })}${field('نص الشريط (إنجليزي)', 'h_aEn', h.announceEn, { ltr: 1 })}</div>
  </div>${saveBar()}`;
}
function bindHome() {
  $('#saveBtn').onclick = () => save('home', {
    heroTitleAr: val('h_tAr'), heroTitleEn: val('h_tEn'), heroBlurbAr: val('h_bAr'), heroBlurbEn: val('h_bEn'),
    announceOn: chk('h_on'), announceAr: val('h_aAr'), announceEn: val('h_aEn')
  });
}

/* ----- products ----- */
const prods = () => (draft.products ||= structuredClone(D.products));
const cats = () => (draft.categories || D.categories);
const catName = id => (cats().find(c => c.id === id) || {}).ar || id;

function vProducts() {
  const list = prods();
  return `<div class="panel"><div class="row"><h2>المنتجات (${list.length})</h2><span class="spacer"></span>
  <input type="text" id="pSearch" placeholder="بحث بالاسم…" style="max-width:220px"><button class="btn" id="addProd" type="button">+ إضافة منتج</button></div>
  <p class="hint">الترتيب هنا هو ترتيب ظهور المنتجات في الموقع. المنتج المخفي لا يظهر للعملاء.</p>
  <div style="display:grid;gap:10px" id="pList">${list.map((p, i) => prodRow(p, i)).join('') || '<p class="hint">لا توجد منتجات.</p>'}</div></div>${saveBar()}`;
}
function prodRow(p, i) {
  return `<div class="item ${p.active === false ? 'off' : ''}" data-i="${i}" data-name="${esc((p.ar + ' ' + (p.en || '') + ' ' + p.sku).toLowerCase())}">
  <div class="thumb" style="${thumbStyle(p)}"></div>
  <div><b>${esc(p.ar)}${p.active === false ? '<span class="badge off">مخفي</span>' : ''}${p.added ? '<span class="badge ok">جديد</span>' : ''}</b>
  <span class="sub">${esc(catName(p.cat))} · ${money(p.price)} ر.س${p.was ? ` <s>${money(p.was)}</s>` : ''} · ${esc(p.sku)}</span></div>
  <div class="acts row"><button type="button" class="btn ghost sm" data-up="${i}" ${i === 0 ? 'disabled' : ''}>↑</button><button type="button" class="btn ghost sm" data-down="${i}" ${i === prods().length - 1 ? 'disabled' : ''}>↓</button>
  <button type="button" class="btn sm" data-edit="${i}">تعديل</button></div></div>`;
}
function bindProducts() {
  $('#saveBtn').onclick = () => save('products', prods());
  $('#addProd').onclick = () => editProduct(-1);
  $('#pSearch').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#pList .item').forEach(el => { el.hidden = q && !el.dataset.name.includes(q); });
  };
  $('#pList').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const L = prods();
    if (b.dataset.edit != null) return editProduct(+b.dataset.edit);
    const mv = b.dataset.up != null ? [+b.dataset.up, -1] : b.dataset.down != null ? [+b.dataset.down, 1] : null;

    <div class="imgs">${p.images.map((f, i) => `<div class="im" style="background-image:url('${esc(imgUrl(f))}')">${i === 0 ? '<em>رئيسية</em>' : ''}<button type="button" data-rm="${i}" aria-label="حذف">×</button></div>`).join('')}
    <label class="add-img">+ رفع صورة<input type="file" id="p_file" accept="image/png,image/jpeg,image/webp" multiple hidden></label></div>
    <p class="hint">يتم تصغير الصورة تلقائيًا. الأفضل صورة واضحة للمنتج بأبعاد قريبة من المربع.</p></div>
    <div class="row">${toggle('p_active', 'ظاهر في المتجر', p.active !== false)}${toggle('p_added', 'علامة «جديد»', p.added)}</div>
    <div class="err" id="p_err" hidden></div>
    <div class="row"><button class="btn" id="p_ok" type="button">${isNew ? 'إضافة' : 'تم'}</button><button class="btn ghost" type="button" id="p_cancel">إلغاء</button><span class="spacer"></span>
    ${isNew ? '' : '<button class="btn danger" type="button" id="p_del">حذف المنتج</button>'}</div></form>`;
    $('#p_cancel').onclick = () => dlg.close();
    $('#p_file').onchange = async e => {
      for (const file of e.target.files) {
        try { collect(); p.images.push(await uploadImage(file)); } catch (err) { toast(err.message, true); }
      }
      draw();
    };
    dlg.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { collect(); p.images.splice(+b.dataset.rm, 1); draw(); });
    $('#p_ok').onclick = () => {
      collect();
      const price = Number(p.price);
      if (!p.ar.trim()) return fail('اسم المنتج بالعربي مطلوب');
      if (!(price > 0)) return fail('اكتب سعرًا صحيحًا');
      if (p.was && Number(p.was) <= price) return fail('السعر قبل الخصم يجب أن يكون أكبر من السعر الحالي');
      p.price = price; p.was = p.was ? Number(p.was) : 0;

      markDirty(); dlg.close(); render();

    if (!isNew) $('#p_del').onclick = () => {

  const collect = () => {
    p.ar = val('p_ar'); p.en = val('p_en'); p.cat = val('p_cat'); p.price = val('p_price'); p.was = val('p_was');
    p.dar = val('p_dar'); p.den = val('p_den'); p.kw = val('p_kw'); p.active = chk('p_active'); p.added = chk('p_added');
  };
  draw();
  dlg.showModal();
}

async function uploadImage(file) {
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw new Error('الصيغ المسموحة: PNG أو JPG أو WEBP');
  const bmp = await createImageBitmap(file);
  const max = 1400, scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.86));
  if (!blob || blob.type !== 'image/webp') blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  const r = await api('/api/admin/upload', 'POST', { data: btoa(bin) });
  return r.url;
}

    ${step(anyOnline, 'فعّلتم وسيلة دفع إلكتروني على الأقل من تبويب «الدفع والشحن»')}
    ${step(D.payments.checkoutEnabled, 'تفعيل «إتمام الطلب داخل الموقع» من تبويب «الدفع والشحن»')}
    ${step(env.publicUrl, 'عنوان الموقع العام مضبوط (PUBLIC_URL)، ضروري على الاستضافة ليعود العميل لموقعكم بعد الدفع')}
  </ul>
  ${env.gatewaysReady ? '<div class="hint">البوابة جاهزة: ستظهر وسائل الدفع الإلكتروني للعميل عند إتمام الطلب.</div>' : '<div class="warn">البوابة لم تكتمل بعد، لذلك يبقى الدفع الإلكتروني معطّلًا ويستمر الطلب عبر واتساب.</div>'}
  </div>${saveBar('حفظ إعدادات البوابة')}`;
}
function bindGateway() {
  $('#saveBtn').onclick = async () => {
    const payload = { enabled: chk('gw_enabled') };
    const key = val('gw_key').trim();
    if (key) payload.secretKey = key;
    if (await save('gateway', payload)) render();
  };
  const test = $('#gwTest');
  if (test) test.onclick = async () => {
    test.disabled = true; test.textContent = 'جاري الاختبار…';
    try {
      const r = await api('/api/admin/gateway/test', 'POST', {});
      toast(r.ok ? `الاتصال ناجح ✓ (${r.mode === 'live' ? 'وضع حقيقي' : 'وضع تجريبي'})` : r.message, !r.ok);
    } catch (e) { toast(e.message, true); }
    test.disabled = false; test.textContent = 'اختبار الاتصال';
  };
  const clear = $('#gwClear');
  if (clear) clear.onclick = async () => {
    if (!confirm('سيتم حذف المفتاح وإيقاف الدفع الإلكتروني. متأكد؟')) return;
    if (await save('gateway', { clearSecret: true })) render();
  };
}

/* ----- orders ----- */
const ORDER_ST = { awaiting_confirmation: 'بانتظار التأكيد', pending_payment: 'بانتظار الدفع', awaiting_transfer: 'بانتظار التحويل', cod_confirmed: 'مؤكد – دفع عند الاستلام', paid: 'مدفوع', deposit_paid: 'تم دفع العربون', payment_failed: 'فشل الدفع', in_fabrication: 'قيد التجهيز', shipped: 'تم الشحن', delivered: 'تم التسليم', cancelled: 'ملغي' };
const PAY_NAME = Object.fromEntries(PAYMENTS.map(([k, l]) => [k, l]));
function vOrders() {
  return `<div class="panel"><div class="row"><h2 style="margin:0">الطلبات</h2><span class="spacer"></span><button class="btn ghost sm" id="ordReload" type="button">تحديث</button></div>
  <p class="hint">تظهر هنا الطلبات المُتمّة داخل الموقع (وليس طلبات واتساب). غيّر الحالة بعد التجهيز أو الشحن.</p>
  <div id="ordBox" class="hint">جاري التحميل…</div></div>`;
}
async function bindOrders() {
  $('#ordReload').onclick = bindOrders;
  const box = $('#ordBox');
  let r;
  try { r = await api('/api/admin/orders'); } catch (e) { box.textContent = e.message; return; }
  if (!r.configured) { box.className = 'warn'; box.textContent = 'لعرض الطلبات يلزم ربط قاعدة البيانات PostgreSQL (DATABASE_URL).'; return; }
  if (!r.orders.length) { box.textContent = 'لا توجد طلبات بعد.'; return; }
  box.className = '';
  box.innerHTML = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px">
    <thead><tr style="text-align:start;border-bottom:1px solid var(--line)"><th style="padding:8px;text-align:start">الطلب</th><th style="text-align:start">العميل</th><th style="text-align:start">الإجمالي</th><th style="text-align:start">الدفع</th><th style="text-align:start">الحالة</th></tr></thead>
    <tbody>${r.orders.map(o => `<tr style="border-bottom:1px solid var(--line)">
      <td style="padding:8px"><b dir="ltr">${esc(o.no)}</b><div class="hint">${esc(new Date(o.at).toLocaleString('ar-EG'))} · ${o.items} صنف</div></td>
      <td>${esc(o.name || '')}<div class="hint" dir="ltr" style="text-align:start">${esc(o.mobile || '')}</div><div class="hint">${esc(o.city || '')}</div></td>
      <td><b>${money(o.total)}</b> ر.س${o.dueNow != null && Number(o.dueNow) < Number(o.total) ? `<div class="hint">المطلوب الآن ${money(o.dueNow)}</div>` : ''}</td>
      <td>${esc(PAY_NAME[o.pay] || o.pay)}</td>
      <td><select data-no="${esc(o.no)}">${Object.entries(ORDER_ST).map(([k, l]) => `<option value="${k}" ${k === o.status ? 'selected' : ''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
  box.querySelectorAll('select[data-no]').forEach(sel => {
    sel.onchange = async () => {
      try { await api(`/api/admin/orders/${encodeURIComponent(sel.dataset.no)}/status`, 'PUT', { status: sel.value }); toast('تم تحديث الحالة ✓'); }
      catch (e) { toast(e.message, true); }
    };
  });
}

/* ----- security ----- */
function vSecurity() {
  return `<div class="panel"><h2>بيانات الدخول</h2>
  <p class="hint">اسم المستخدم الحالي: <b dir="ltr">${esc(D.username || '')}</b></p>
  <div class="grid3">${field('اسم المستخدم الجديد (اختياري)', 'pw_user', '', { hint: 'حروف إنجليزية وأرقام و . _ - @ (3 إلى 40)' })}${field('كلمة المرور الجديدة (اختياري)', 'pw_new', '', { type: 'password', hint: '8 أحرف على الأقل' })}${field('تأكيد كلمة المرور الجديدة', 'pw_new2', '', { type: 'password' })}</div>
  <div class="grid3">${field('كلمة المرور الحالية (مطلوبة للحفظ)', 'pw_cur', '', { type: 'password' })}</div>
  <div><button class="btn" id="pwBtn" type="button">حفظ بيانات الدخول</button></div>
  <p class="hint">بعد التغيير تُغلق جميع الجلسات الأخرى تلقائيًا. احتفظ بنسخة احتياطية من مجلد <b dir="ltr">data</b> في السيرفر، فهو يحتوي كل تعديلاتك وصور المنتجات المرفوعة.</p></div>`;
}
function bindSecurity() {
  $('#pwBtn').onclick = async () => {
    if (val('pw_new') !== val('pw_new2')) return toast('تأكيد كلمة المرور غير مطابق', true);
    if (!val('pw_user').trim() && !val('pw_new')) return toast('اكتب اسم مستخدم جديدًا أو كلمة مرور جديدة', true);
    try {
      await api('/api/admin/password', 'POST', { current: val('pw_cur'), username: val('pw_user').trim(), next: val('pw_new') });
      toast('تم حفظ بيانات الدخول ✓');
      if (val('pw_user').trim()) D.username = val('pw_user').trim().toLowerCase();
      render();
    } catch (e) { toast(e.message, true); }
  };
}
/* ---------- events ---------- */
$('#tabs').onclick = e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (dirty && !confirm('لديك تعديلات غير محفوظة. هل تريد تجاهلها؟')) return;
  draft = {}; setDirty(false); tab = b.dataset.tab; render();
};
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const err = $('#loginErr'); err.hidden = true;
  try { await api('/api/admin/login', 'POST', { username: $('#loginUser').value, password: $('#loginPass').value }); await boot(); }
  catch (ex) { err.textContent = ex.message; err.hidden = false; }
};
$('#logoutBtn').onclick = async () => { try { await api('/api/admin/logout', 'POST', {}); } catch { /* ignore */ } showLogin(); };
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
</body>
</html>
