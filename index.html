<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>كنوز الحقول | متجر منتجات غذائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* ==========================================================================
   Knooz — Modern Premium Design System
   Black + Gold + Cream palette, Arabic-first typography
   ========================================================================== */
:root,[data-theme="light"]{
  --bg:#fff8ec; --surface:#ffffff; --surface-2:#fdf0da; --surface-3:#f8e4c2;
  --fg:#23211f; --fg-2:#3a3633; --muted:#6b645c; --line:#efdcbc; --line-2:#e6cfa5;
  --steel:#23211f; --steel-2:#171514; --steel-fg:#fff8ec;
  --wood:#f78502; --wood-strong:#b25a00; --wood-light:#ff9f33; --wood-soft:#fff0d3;
  --wood-glow:rgba(247,133,2,0.14);
  --ok:#4f7d1c; --ok-soft:#eef6e0; --leaf:#78b922; --warn:#b45309; --warn-soft:#fdf0e0;
  --sale:#b91c1c; --sale-soft:#fbeaea;
  --focus:#f78502; --ring:rgba(247,133,2,0.3);
  --shadow-xs:0 1px 2px rgb(35 33 31 / 0.05);
  --shadow-sm:0 4px 12px rgb(35 33 31 / 0.06);
  --shadow-md:0 10px 24px rgb(35 33 31 / 0.08);
  --shadow-lg:0 18px 40px rgb(35 33 31 / 0.12);
  --r:16px; --r-sm:10px; --r-lg:20px; --r-pill:999px;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --transition:all 0.25s ease;
  --transition-fast:all 0.15s ease;
  --gold-gradient:linear-gradient(135deg,#ff9a1f 0%,#f78502 55%,#e07400 100%);
  --dark-gradient:linear-gradient(180deg,#23211f 0%,#171514 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  position:relative;
  margin:0;
}
body::before{
  content:"";
  position:fixed;
  inset:0 0 auto;
  height:env(safe-area-inset-top,0px);
  z-index:60;
  background:var(--steel-2);
}
body::after{content:none;animation:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(28px, 5vw, 48px);font-weight:700;letter-spacing:-0.02em}
h2{font-size:clamp(22px, 4vw, 32px);font-weight:700;letter-spacing:-0.01em}
h3{font-size:clamp(18px, 3vw, 24px);font-weight:600}
p{margin:0}

/* Buttons — modern pill + solid styles with glow effects */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 20px;border-radius:var(--r-pill);
  font-family:var(--f-body);font-size:15px;font-weight:600;line-height:1;
  white-space:nowrap;transition:var(--transition);border:1px solid transparent;
  position:relative;overflow:hidden;
}
.btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transform:translateX(-100%);
  transition:transform 0.6s;
}
.btn:hover::before{transform:translateX(100%);}
.btn.primary{
  background:var(--gold-gradient);
  color:#23211f;
  box-shadow:0 4px 20px rgba(247,133,2,0.4), 0 0 40px rgba(247,133,2,0.2);
  border:1px solid rgba(247,133,2,0.3);
}
.btn.primary:hover{
  box-shadow:0 6px 30px rgba(247,133,2,0.5), 0 0 60px rgba(247,133,2,0.3);
  transform:translateY(-2px) scale(1.02);
}
.btn.primary:active{transform:translateY(0) scale(0.98);}
.btn.ghost{
  background:rgba(255,255,255,0.05);
  color:var(--fg);
  border-color:var(--line);
  backdrop-filter:blur(10px);
}
.btn.ghost:hover{
  background:rgba(247,133,2,0.1);
  border-color:var(--wood);
  color:var(--wood-strong);
  box-shadow:0 0 20px rgba(247,133,2,0.2);
}
.btn.dark{
  background:var(--steel);
  color:var(--steel-fg);
  border:1px solid var(--line);
}
.btn.dark:hover{
  background:var(--steel-2);
  border-color:var(--wood);
  box-shadow:0 0 20px rgba(247,133,2,0.2);
}
.btn.wa{
  background:#25d366;
  color:#fff;
  box-shadow:0 4px 15px rgba(37,211,102,0.3);
}
.btn.wa:hover{
  background:#128c7e;
  box-shadow:0 6px 20px rgba(37,211,102,0.4);
  transform:translateY(-2px);
}
.btn.alt{
  background:transparent;
  color:var(--muted);
  border-color:var(--line);
}
.btn.alt:hover{
  background:var(--surface-2);
  border-color:var(--wood-light);
  color:var(--wood-strong);
}
.btn.full{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px}
.btn:disabled{opacity:0.55;cursor:not-allowed}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--wood-strong);font-weight:600;font-size:14px;transition:var(--transition-fast)}
.link:hover{color:var(--wood)}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.sale{background:var(--sale-soft);color:var(--sale)}
.badge.wood{background:var(--wood-soft);color:var(--wood-strong)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);font-size:13px;color:var(--fg);transition:var(--transition-fast)}
.chip:hover{border-color:var(--wood-light);color:var(--wood-strong)}
.chip.on{background:var(--wood);border-color:var(--wood);color:#23211f;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);transition:var(--transition);color:var(--fg)}
.panel:hover{border-color:var(--line-2);box-shadow:var(--shadow-md)}
.panel h3,.panel h2{color:var(--fg)}
.panel .muted,.panel p{color:var(--muted)}
.sec{margin-bottom:var(--space-10)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6)}
.sec-h h2{font-size:20px;font-weight:700;color:var(--fg)}
.sec-h .link{font-size:14px}
.wa-fab{
  position:fixed;z-index:70;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:inline-flex;align-items:center;gap:8px;
  height:48px;padding:0 18px 0 14px;border-radius:999px;
  background:#25D366;color:#fff!important;font-weight:700;font-size:16px;line-height:1;
  text-decoration:none;box-shadow:0 8px 24px rgba(37,211,102,.38);
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}
.wa-fab:hover{background:#1ebe57;color:#fff!important;transform:translateY(-1px);box-shadow:0 10px 28px rgba(37,211,102,.45)}
.wa-fab svg{width:26px;height:26px;flex:none;display:block}
.wa-fab span{letter-spacing:.01em}
@media (max-width:640px){
  .wa-fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));left:12px;height:46px;padding:0 16px 0 12px;font-size:15px}
  .wa-fab svg{width:24px;height:24px}
}
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
  background:rgba(255,252,248,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.strip{display:none}
.bar{background:transparent;color:var(--fg)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;padding:0;transition:var(--transition-fast);}
.logo:hover{transform:scale(1.02);}
.logo img{height:72px;width:auto;object-fit:contain;display:block}
.logo .brand-wrap{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand-name,.logo b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--fg);letter-spacing:-.01em;background:none;-webkit-text-fill-color:unset;background-clip:unset;}
.logo .brand-wrap{display:grid;gap:1px;text-align:start}
.logo .brand-wrap small,.logo span{font-size:11.5px;color:var(--muted);font-weight:500;-webkit-text-fill-color:unset}
.search{flex:1 1 280px;display:flex;min-width:0;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;position:relative}
.search input{flex:1;min-width:0;height:42px;padding:0 12px;border:0;background:#fff;color:#1b2228;font-size:14px;outline:none}
.search input::placeholder{color:var(--muted)}
.search .go{height:42px;padding:0 16px;background:var(--wood);color:#23211f;border:0;border-radius:0;font-weight:700;font-size:14px;flex:none}
.search .go:hover{background:var(--wood-strong)}
.suggest{position:absolute;top:calc(100% + 4px);inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-md);z-index:70;overflow:hidden}
.suggest button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:8px 10px;border-bottom:1px solid var(--line)}
.hbtn,.cartbtn{
  position:relative;min-width:40px;height:40px;padding:0 6px;border-radius:10px;
  color:var(--fg);display:flex;align-items:center;justify-content:center;gap:4px;
  transition:var(--transition-fast);background:none;border:0;
}
.hbtn:hover,.cartbtn:hover{background:var(--surface-2);color:var(--wood-strong)}
.badge-count{
  position:absolute;top:2px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 4px;
  background:var(--wood);color:#23211f;font-size:10.5px;font-weight:700;
  border-radius:999px;display:inline-grid;place-items:center;
}
.nav{background:transparent;border-top:0;padding-bottom:2px}
.nav .wrap{display:flex;gap:2px;align-items:center;overflow-x:auto;padding-block:0 8px;scrollbar-width:none}
.nav button{background:none;border:0;color:var(--fg-2);white-space:nowrap;padding:8px 12px;border-radius:999px;font-size:13.5px;font-weight:600}
.nav button:hover{background:var(--surface-2);color:var(--wood-strong)}
.allbtn{font-weight:700;display:flex;gap:6px;align-items:center;color:var(--fg);background:var(--surface-2);border:1px solid var(--line)}
.mega{
  position:absolute;inset-inline:0;z-index:90;background:var(--surface);color:var(--fg);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow-lg);
  max-height:calc(100dvh - 150px);overflow-y:auto;
}
.mega .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-6);padding-block:22px}
.mega h3{font-size:14px;font-weight:700;color:var(--wood-strong);margin-bottom:var(--space-3)}
.mega ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mega li button{background:none;border:0;padding:5px 0;text-align:start;width:100%;color:var(--fg)}
.mega li button:hover{color:var(--wood-strong)}

/* Layout */
main{padding-block:0 48px;min-height:60vh}
.sec{margin-top:36px;margin-bottom:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.sec-h h2{font-size:clamp(18px,2.2vw,22px);font-weight:700;color:var(--fg)}
.sec-h .link{font-size:14px}

/* Hero Section - Dramatic & Cinematic - All Products */
.hero{
  position:relative;padding:var(--space-12) 0 var(--space-16);overflow:hidden;
  min-height:85vh;
  display:flex;
  align-items:center;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 100% 60% at 30% 40%, rgba(247,133,2,0.12) 0%, transparent 55%),
    radial-gradient(ellipse 80% 50% at 70% 60%, rgba(247,133,2,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 80%, rgba(247,133,2,0.06) 0%, transparent 45%);
  animation:heroGlow 10s ease-in-out infinite alternate;
}
@keyframes heroGlow{
  0%{opacity:0.5;transform:scale(1) rotate(0deg);}
  100%{opacity:1;transform:scale(1.15) rotate(2deg);}
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, transparent 0%, var(--bg) 85%);
  pointer-events:none;
}
.hero .main{
  position:relative;z-index:5;text-align:center;padding:0 var(--space-4);
  max-width:1000px;
  margin:0 auto;
}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;background:rgba(247,133,2,0.15);color:var(--wood-strong);
  border-radius:var(--r-pill);font-size:12px;font-weight:700;
  letter-spacing:0.04em;text-transform:uppercase;
  margin-bottom:var(--space-6);
  box-shadow:0 0 30px rgba(247,133,2,0.3);
  border:1px solid rgba(247,133,2,0.3);
  animation:eyebrowFloat 3s ease-in-out infinite;
}
@keyframes eyebrowFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}
.hero .kicker{
  font-size:14px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.05em;margin-bottom:var(--space-3);
  opacity:0.8;
}
.hero .main h1,.hero .hero-title{
  font-size:clamp(28px, 5vw, 48px);font-weight:800;color:var(--fg);
  line-height:1.2;letter-spacing:-0.02em;margin-bottom:var(--space-4);
  background:none;-webkit-text-fill-color:unset;animation:none;
}
.hero .main h1 b{color:var(--wood-strong);-webkit-text-fill-color:var(--wood-strong)}
.hero .main p,.hero .hero-blurb{
  font-size:clamp(15px, 2.2vw, 18px);color:var(--muted);
  line-height:1.7;max-width:46ch;margin:0 auto var(--space-6);
  text-shadow:none;
}
.hero .main .art{margin-top:var(--space-8);display:block;width:min(420px,90%);margin-inline:auto;position:relative;min-height:220px}
.hero .hero-title{font-family:var(--f-display);font-weight:800}
.hero .btn{margin:0 var(--space-2)}
.hero .btn.ghost{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--fg);
}
.hero .btn.ghost:hover{
  background:var(--surface-2);
  border-color:var(--wood);
  color:var(--wood-strong);
  box-shadow:var(--shadow-sm);
}
.hero .main .art .ph{position:absolute;inset:0;background:transparent}
.hero .main .art .ph>img,.hero .slide .ph>img{
  object-fit:contain;object-position:center;
  padding:7% 14% 12%;background:transparent;
  filter:drop-shadow(0 22px 36px rgba(0,0,0,.42));
}
.hero .main .art .ph>svg,.hero .slide .ph>svg{opacity:.06}
.hero .dots{position:absolute;inset-inline:0;bottom:16px;z-index:3;display:flex;gap:7px;justify-content:center}
.hero .dots{position:relative;inset:auto;bottom:auto;margin-top:10px;justify-content:center}
.hero .dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--line-2);cursor:pointer}
.hero .dots button.on{background:var(--wood);width:20px;border-radius:999px}
.hero-chip{
  display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:10px auto 0;padding:10px 12px;width:max-content;max-width:100%;
  border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--fg);text-align:start;
  box-shadow:var(--shadow-sm);
}
.hero-chip:hover{border-color:var(--wood-light);background:var(--wood-soft)}
.hero-chip .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero-chip .hero-feat{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--fg)}
.hero-chip .go{font-size:12.5px;color:var(--wood-strong);font-weight:600}
.hero-proof{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;justify-content:center}
.hero-proof span{
  font-size:12px;font-weight:600;color:var(--fg-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;
  background:var(--surface);
}
.why-band .why{margin-top:4px}
.why .panel{padding:18px 16px}
.why .panel h3{font-size:16px;margin:0 0 6px}
.why .panel p{margin:0;font-size:13.5px;line-height:1.55}
.trust{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;
  margin:20px 0 4px;border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;background:var(--surface);
}
.trust div{
  padding:16px 14px;display:grid;gap:4px;text-align:center;
  border-inline-start:1px solid var(--line);
}
.trust div:first-child{border-inline-start:0}
.trust b{color:var(--fg);font-weight:700;font-family:var(--f-display);font-size:13.5px}
.trust small{font-size:12px;color:var(--muted);line-height:1.4}

/* Category tiles - Glassmorphism with glow */
.cats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:var(--space-5);
}
.cat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:var(--space-5);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:var(--space-3);
  text-align:center;
  transition:var(--transition);
  cursor:pointer;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.cat::before{content:none}
.cat:hover{
  border-color:var(--wood-light);
  transform:translateY(-4px);
  box-shadow:var(--shadow-md);
}
.cat:hover::before{opacity:1;}
.cat .im{
  width:72px;height:72px;
  border-radius:var(--r);
  overflow:hidden;
  background:rgba(247,133,2,0.1);
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(247,133,2,0.2);
  transition:var(--transition);
}
.cat:hover .im{
  background:rgba(247,133,2,0.2);
  border-color:var(--wood);
  box-shadow:0 0 20px rgba(247,133,2,0.3);
}
.cat .im svg{width:100%;height:100%;display:block;color:var(--wood-strong);transition:var(--transition);}
.cat:hover .im svg{transform:scale(1.1);}
.cat span{
  font-size:13px;font-weight:600;color:var(--fg);
  line-height:1.3;
  transition:var(--transition-fast);
}
.cat:hover span{color:var(--wood-strong);transform:translateY(2px);}

/* Basket / promo strip */
.basket{
  display:grid;
  grid-template-columns:1fr;
  gap:0;
  overflow:hidden;
  align-items:stretch;
  border-radius:var(--r-lg);
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-sm);
  margin-bottom:var(--space-8);
}
.basket .copy{
  padding:var(--space-6);
  display:grid;gap:var(--space-3);align-content:center;
}
.basket .copy h2{
  font-size:clamp(20px,4vw,26px);
  font-weight:800;color:var(--fg);
  line-height:1.2;
}
.basket .items{
  display:flex;gap:var(--space-3);flex-wrap:wrap;
}
.basket .item{
  width:84px;text-align:center;font-size:12px;color:var(--muted);
}
.basket .item .im{
  width:84px;height:84px;
  border-radius:var(--r);overflow:hidden;
  border:1px solid var(--line);
  margin-bottom:var(--space-2);
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
}
.basket .item .im svg{width:100%;height:100%;display:block;color:var(--muted)}
.basket .price-row{
  display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.row{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,220px);
  gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none;
}
.row::-webkit-scrollbar{display:none}
.row > *{scroll-snap-align:start}
/* Product cards - Enhanced with glassmorphism and dramatic effects */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:var(--space-6);
}
.row{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(220px,260px);
  gap:var(--space-4);
  overflow-x:auto;
  padding-bottom:var(--space-4);
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}
.row::-webkit-scrollbar{display:none}
.row > *{scroll-snap-align:start}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  transition:var(--transition);
  box-shadow:var(--shadow-sm);
  color:var(--fg);
}
.card::before{content:none}
.card:hover{
  border-color:var(--wood-light);
  transform:translateY(-4px);
  box-shadow:var(--shadow-md);
}
.card .im{
  aspect-ratio:4/3;
  background:var(--surface-2);
  border:0;
  padding:0;
  display:block;
  width:100%;
  overflow:hidden;
  position:relative;
}
.card .im::after{content:none}
.card .im svg{width:100%;height:100%;display:block;color:var(--muted);transition:var(--transition);}
.card:hover .im svg{transform:scale(1.1);}
.card .bd{
  padding:var(--space-4);
  display:flex;
  flex-direction:column;
  gap:var(--space-2);
  flex:1;
  position:relative;
  z-index:1;
}
.card .nm{
  background:none;border:0;padding:0;
  text-align:start;
  font-weight:600;font-size:15px;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:2.8em;
  color:var(--fg);
  transition:var(--transition-fast);
}
.card .nm:hover{color:var(--wood-strong);transform:translateX(4px);}
.card .sku{font-size:12px;color:var(--muted)}
.price{font-weight:700;font-size:17px;color:var(--fg);letter-spacing:0;text-shadow:none}
.price small{font-size:12px;font-weight:500;color:var(--muted)}
.was{color:var(--muted);text-decoration:line-through;font-size:12.5px;margin-inline-start:6px}
.card .tags{display:flex;gap:4px;flex-wrap:wrap}
.card .act{margin-top:auto;display:grid}
.card .act .btn{padding:8px 12px;font-size:14px;height:auto}
.wishbtn{
  position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:2;
}
.wishbtn svg{width:18px;height:18px}
.wishbtn:hover{background:var(--surface-2);border-color:var(--wood);color:var(--wood-strong);transform:none;box-shadow:none}
.wishbtn.on{color:var(--sale);border-color:var(--sale);background:var(--sale-soft);box-shadow:none}
.corner{
  position:absolute;top:var(--space-3);inset-inline-start:var(--space-3);
  display:flex;gap:var(--space-2);
}
.inst-line{font-size:12px;color:var(--muted)}

/* Listing */
.crumbs{
  font-size:13px;color:var(--muted);display:flex;
  gap:6px;flex-wrap:wrap;margin-bottom:var(--space-4);
}
.crumbs button{
  background:none;border:0;padding:0;color:var(--wood-strong);
  font-weight:600;
}
.crumbs button:hover{color:var(--wood)}
.listing{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:var(--space-8);
  align-items:start;
}
.filters{
  display:none; /* hidden on desktop, shown on mobile via button */
  padding:var(--space-4);
  display:grid;
  gap:var(--space-4);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);
}
.filters h4{
  margin:0 0 var(--space-2);
  font-size:14px;font-weight:700;color:var(--fg);
  text-transform:uppercase;letter-spacing:0.04em;
}
.filters label{
  display:flex;gap:var(--space-2);align-items:center;
  font-size:14px;padding:var(--space-1) 0;
}
.filters input[type=range]{width:100%;accent-color:var(--wood)}
.toolbar{
  display:flex;justify-content:space-between;
  align-items:center;gap:var(--space-3);
  flex-wrap:wrap;margin-bottom:var(--space-4);
}
.toolbar select{
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  padding:var(--space-2) var(--space-4);
  background:var(--surface-2);
  color:var(--fg);
  font-size:13px;
}
.empty{
  padding:var(--space-12) var(--space-4);
  text-align:center;
}
.empty h2{
  font-size:22px;font-weight:700;color:var(--fg);
  margin-bottom:var(--space-2);
}
.empty p{color:var(--muted);margin-bottom:var(--space-4)}

/* Product page */
.pdp{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  gap:var(--space-8);
  align-items:start;
}
.gal .big{
  border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--line);
  aspect-ratio:4/3;background:var(--surface-2);
  box-shadow:var(--shadow-sm);
}
.gal .big svg{width:100%;height:100%;display:block}
.gal .thumbs{
  display:flex;gap:var(--space-2);
  margin-top:var(--space-3);flex-wrap:wrap;
}
.gal .thumbs button{
  width:72px;aspect-ratio:4/3;padding:0;
  border:2px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;background:none;
  transition:var(--transition-fast);
}
.gal .thumbs button.on{
  border-color:var(--wood);
  box-shadow:0 0 0 2px var(--ring);
}
.gal .thumbs button:hover{border-color:var(--wood-light)}
.gal .thumbs svg{width:100%;height:100%;display:block}
.info{display:grid;gap:var(--space-4)}
.info h1{
  font-size:clamp(24px,4vw,32px);
  font-weight:800;color:var(--fg);
  line-height:1.25;
}
.opt h4{
  margin:0 0 var(--space-2);
  font-size:13px;font-weight:700;color:var(--fg-2);
  text-transform:uppercase;letter-spacing:0.05em;
}
.opt .vals{display:flex;gap:var(--space-2);flex-wrap:wrap}
.opt .vals button{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--r-pill);
  padding:var(--space-1) var(--space-4);
  font-size:13px;color:var(--fg);
  transition:var(--transition-fast);
}
.opt .vals button:hover{border-color:var(--wood-light)}
.opt .vals button.on{
  border-color:var(--wood);
  background:var(--wood-soft);
  color:var(--wood-strong);
}
.cfg{
  padding:var(--space-4);
  display:grid;gap:var(--space-3);
  background:var(--surface-2);
  border-radius:var(--r-lg);
}
.cfg .f{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:var(--space-3);
}
.field{display:grid;gap:var(--space-1);font-size:13px}
.field label{
  font-size:12px;font-weight:600;color:var(--fg-2);
  margin-bottom:var(--space-1);
}
.field input,.field select,.field textarea{
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  padding:var(--space-2) var(--space-3);
  background:var(--surface);
  width:100%;
  color:var(--fg);
  font-size:14px;
  transition:var(--transition-fast);
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--wood);
  box-shadow:0 0 0 3px var(--ring);
  outline:none;
}
.field input::placeholder{color:var(--muted)}
.buybox{
  padding:var(--space-4);
  display:grid;gap:var(--space-3);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.buybox .price{
  font-size:clamp(22px,4vw,28px);
  font-weight:800;color:var(--fg);
}
.qty{
  display:flex;align-items:center;
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  width:max-content;overflow:hidden;
  background:var(--surface-2);
}
.qty button{
  border:0;background:var(--surface);
  width:40px;height:40px;font-size:18px;
  color:var(--fg);font-weight:700;
  transition:var(--transition-fast);
}
.qty button:hover{background:var(--surface);color:var(--wood-strong)}
.qty input{
  width:56px;text-align:center;border:0;
  background:transparent;height:40px;font-size:14px;
  color:var(--fg);
}
.specs{
  width:100%;border-collapse:collapse;
  font-size:13px;color:var(--fg-2);
}
.specs th,.specs td{
  padding:var(--space-2) var(--space-3);
  border-bottom:1px solid var(--line);
  text-align:start;vertical-align:top;
}
.specs th{
  width:38%;background:var(--surface-2);
  font-weight:600;color:var(--fg);
}
.tabs{
  display:flex;gap:var(--space-1);
  border-bottom:1px solid var(--line);
  margin-bottom:var(--space-4);
  overflow-x:auto;
}
.tabs button{
  border:0;background:none;
  padding:var(--space-2) var(--space-3);
  font-weight:600;font-size:14px;
  border-bottom:3px solid transparent;
  white-space:nowrap;color:var(--muted);
  transition:var(--transition-fast);
}
.tabs button:hover{color:var(--fg)}
.tabs button.on{
  border-color:var(--wood);
  color:var(--wood-strong);
}
.fbt{
  display:flex;gap:var(--space-3);
  align-items:center;flex-wrap:wrap;
  padding:var(--space-4);
}
.fbt .it{
  width:100px;text-align:center;font-size:12px;
  color:var(--muted);
}
.fbt .it .im{
  border-radius:var(--r-sm);overflow:hidden;
  aspect-ratio:4/3;border:1px solid var(--line);
  margin-bottom:var(--space-2);
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
}
.fbt .it svg{width:100%;height:100%;display:block;color:var(--muted)}
.plus{
  font-size:24px;color:var(--muted);
  align-self:center;
}

/* Drawer & Modal */
.scrim{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.45);
  z-index:80;backdrop-filter:blur(4px);
}
.drawer{
  position:fixed;top:0;bottom:0;inset-inline-end:0;
  width:min(420px,100%);
  background:var(--surface);
  z-index:90;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:var(--shadow-lg);
  border-inline-start:1px solid var(--line);
  transform:translateX(100%);
  transition:transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
[dir=rtl] .drawer{transform:translateX(-100%)}
.drawer.open{transform:translateX(0)!important}
.drawer .hd{
  display:flex;justify-content:space-between;align-items:center;
  padding:var(--space-4);border-bottom:1px solid var(--line);
  background:var(--surface-2);
}
.drawer .ls{
  flex:1;overflow:auto;padding:var(--space-4);
  display:grid;gap:var(--space-3);align-content:start;
}
.drawer .ft{
  border-top:1px solid var(--line);
  padding:var(--space-4);
  display:grid;gap:var(--space-3);
  background:var(--surface-2);
}
.drawer .ft .btn.wa{width:100%;height:48px;font-size:15.5px;font-weight:700}
.wa-lead .box{display:grid;gap:12px;width:min(440px,92vw)}
.wa-lead .wa-sum{margin:0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);display:grid;gap:6px;font-size:13.5px}
.wa-lead .wa-sum .tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.wa-lead .btn.wa{width:100%;height:48px;font-weight:700}
.xbtn{
  border:0;background:var(--surface-2);
  width:40px;height:40px;border-radius:50%;
  font-size:18px;color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition-fast);
}
.xbtn:hover{background:var(--line);color:var(--wood-strong)}
.line{
  display:grid;
  grid-template-columns:64px minmax(0,1fr);
  gap:var(--space-3);
  padding-bottom:var(--space-3);
  border-bottom:1px solid var(--line);
}
.line .im{
  border-radius:var(--r-sm);overflow:hidden;
  aspect-ratio:4/3;background:var(--surface-2);
}
.line .im svg{
  display:block;width:100%;height:100%;color:var(--muted)
}
.line .meta{
  font-size:13px;color:var(--fg-2);
  line-height:1.4;
}
.line .ctl{
  display:flex;gap:var(--space-2);
  align-items:center;justify-content:space-between;
  margin-top:var(--space-1);flex-wrap:wrap;
}
.line .qty button{
  width:32px;height:32px;font-size:15px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--fg);
}
.line .qty button:hover{background:var(--surface-2)}
.line .qty input{
  width:48px;height:32px;
  text-align:center;border:0;
  background:transparent;font-size:14px;
  color:var(--fg);
}
.sum{
  display:grid;gap:var(--space-2);
  font-size:13px;color:var(--fg-2);
}
.sum div{
  display:flex;justify-content:space-between;gap:var(--space-2);
}
.sum .tot{
  font-size:17px;font-weight:800;
  color:var(--fg);
  border-top:1px solid var(--line);
  padding-top:var(--space-3);
}
.modal{
  position:fixed;inset:0;z-index:100;
  display:grid;place-items:center;
  padding:var(--space-4);
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(8px);
}
.modal .box{
  background:var(--surface);
  border-radius:var(--r-lg);
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  padding:var(--space-6);
  display:grid;gap:var(--space-4);
  position:relative;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--line);
}
.modal .box .close{
  position:absolute;top:var(--space-3);inset-inline-end:var(--space-3);
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition-fast);
}
.modal .box .close:hover{
  background:var(--line);
  color:var(--wood-strong);
}
.toast{
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  inset-inline-start:50%;
  transform:translateX(-50%);
  background:var(--steel);
  color:var(--steel-fg);
  padding:var(--space-3) var(--space-5);
  border-radius:var(--r-pill);
  z-index:110;
  font-size:14px;
  font-weight:600;
  box-shadow:var(--shadow-lg);
  animation:slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
[dir=rtl] .toast{transform:translateX(50%)}
@keyframes slideUp{
  from{opacity:0;transform:translateX(-50%) translateY(20px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
[dir=rtl] @keyframes slideUp{
  from{opacity:0;transform:translateX(50%) translateY(20px)}
  to{opacity:1;transform:translateX(50%) translateY(0)}
}

/* Checkout */
.co{
  display:grid;
  grid-template-columns:minmax(0,1fr) 380px;
  gap:var(--space-8);
  align-items:start;
}
.step{
  padding:var(--space-4);
  display:grid;gap:var(--space-4);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.step h3{
  font-size:17px;
  display:flex;gap:var(--space-2);align-items:center;
  color:var(--fg);
}
.step h3 .n{
  width:26px;height:26px;border-radius:50%;
  background:var(--wood);color:#23211f;
  display:inline-grid;place-items:center;
  font-size:13px;font-weight:700;
}
.f2{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:var(--space-3);
}
.opts{display:grid;gap:var(--space-2)}
.optc{
  display:flex;gap:var(--space-2);align-items:center;
  border:2px solid var(--line);
  border-radius:var(--r);
  padding:var(--space-3) var(--space-4);
  background:var(--surface);
  transition:var(--transition-fast);
  cursor:pointer;
}
.optc:hover{border-color:var(--wood-light)}
.optc:has(input:checked){
  border-color:var(--wood);
  background:var(--wood-soft);
  box-shadow:0 0 0 2px var(--ring);
}
.optc.dis{opacity:0.5;pointer-events:none}
.optc .grow{flex:1;min-width:0}
.optc .sub{font-size:12px;color:var(--muted)}
.pm{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:var(--space-2);
}
.pmark{
  font-weight:700;font-size:11px;
  padding:var(--space-1) var(--space-3);
  border-radius:var(--r-sm);
  white-space:nowrap;
  font-family:var(--f-display);
  text-align:center;
}
.pmark.mada{background:var(--surface-2);color:#259bd6;border:1px solid #cfd8dc}
.pmark.visa{background:#1a1f71;color:#fff}
.pmark.mc{background:var(--surface-2);color:#eb001b;border:1px solid #cfd8dc}
.pmark.apple{background:#000;color:#fff}
.pmark.stc{background:#4f008c;color:#fff}
.pmark.tabby{background:#3bffc1;color:#111}
.pmark.tamara{
  background:linear-gradient(90deg,#f6c7a8,#d9b8f3);
  color:#111;
}
.pmark.bank,.pmark.cod,.pmark.sadad{
  background:var(--surface-2);
  color:var(--fg);
  border:1px solid var(--line);
}
.paystrip{
  display:flex;gap:var(--space-2);flex-wrap:wrap;
}

/* Footer - Enhanced */
footer{
  background:linear-gradient(180deg, var(--steel) 0%, var(--steel-2) 100%);
  color:var(--steel-fg);
  font-size:13.5px;
  padding-block:var(--space-12);
  position:relative;
  overflow:hidden;
}
footer::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--wood), transparent);
  opacity:0.5;
}
footer .cols{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:var(--space-8);
}
footer h4{
  margin:0 0 var(--space-3);
  font-family:var(--f-display);
  font-size:15px;
  color:var(--steel-fg);
}
footer ul{
  list-style:none;padding:0;margin:0;
  display:grid;gap:var(--space-1);
}
footer button{
  background:none;border:0;padding:0;
  color:inherit;opacity:0.85;text-align:start;
  font-size:13px;line-height:1.6;
}
footer button:hover{opacity:1;color:var(--wood-light)}
footer .legal{
  border-top:1px solid rgba(255,255,255,0.12);
  padding-block:var(--space-4);
  display:flex;gap:var(--space-3);
  justify-content:space-between;
  flex-wrap:wrap;
  opacity:0.7;font-size:12px;
}
.projects{
  display:flex;gap:var(--space-2);
  flex-wrap:wrap;
}
.projects span{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  padding:var(--space-1) var(--space-4);
  font-size:12px;
  color:var(--fg);
  font-weight:600;
}
/* Why section - Enhanced */
.why{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:var(--space-6);
}
.why .panel{
  padding:var(--space-6);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  color:var(--fg);
}
.why .panel::before{content:none}
.why .panel:hover{
  transform:translateY(-3px);
  border-color:var(--wood-light);
  box-shadow:var(--shadow-md);
}
.why .panel p,.why .panel .muted{color:var(--muted)}
.why h3{
  font-size:18px;margin-bottom:var(--space-3);
  color:var(--fg);
  background:none;
  -webkit-text-fill-color:unset;
  background-clip:unset;
}
.success{
  max-width:720px;
  margin-inline:auto;
  padding:var(--space-6);
  display:grid;gap:var(--space-3);
}

/* cinematic intro (series title sequence) */
.intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;background:#1a1008;color:#fff8ee;isolation:isolate}
.intro::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 60% at 50% 20%,rgba(247,133,2,.35),transparent 55%),
  radial-gradient(ellipse 70% 50% at 80% 80%,rgba(111,61,16,.5),transparent 50%),
  linear-gradient(180deg,#2a180c 0%,#1a1008 45%,#0f0a06 100%);pointer-events:none}

.intro .crawl{display:grid;gap:10px;padding-block:20px;animation:crawlUp 12s linear 1.2s infinite;font-size:14.5px;color:rgba(255,248,238,.78)}

  order:-1;position:relative;display:block;width:100%;margin:0;min-height:0;
  background:#efe9de;overflow:hidden;
}
.hero .main .art::after{content:none}
.hero .main .art .ph>img,.hero .slide .ph>img{object-fit:cover;object-position:center;padding:0;filter:none;background:transparent}
.hero .dots{position:absolute;inset-inline:0;bottom:12px;margin:0;z-index:3;display:flex;gap:7px;justify-content:center}
.hero .dots button{background:rgba(35,33,31,.3)}
.hero .dots button.on{background:var(--wood);width:20px;border-radius:999px}
@media (max-width:900px){
  .hero .main .art{height:250px;min-height:250px;aspect-ratio:auto;border-radius:18px;border:1px solid var(--line)}
}
@media (min-width:901px){
  .hero .main{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;padding:40px 16px 44px}
  .hero .main .art{
    order:0;max-width:500px;justify-self:center;aspect-ratio:1/1;height:auto;
    border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-lg);
  }
  .hero .main h1,.hero .hero-title{font-size:clamp(30px,3.4vw,44px)}
}
.origin .bg{background:#efdcbc}
.origin .bg .ph>img{object-fit:cover;padding:0;background:transparent}
.origin:hover .bg .ph>img{transform:scale(1.04)}
.bundles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.bundle{display:grid;gap:12px;padding:18px;align-content:start}
.bundle h3{font-size:18px;margin:0}
.bundle .bd-desc{margin:0;font-size:13.5px;color:var(--muted)}
.bundle .bd-thumbs{display:flex;gap:8px}
.bundle .bd-thumbs .im{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.bundle .bd-thumbs .im .ph,.bundle .bd-thumbs .im .ph>img{width:100%;height:100%}
.bundle .bd-list{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--fg-2)}
.bundle .bd-list li{display:flex;justify-content:space-between;gap:8px}
.bundle .bd-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.bundle .bd-price{font-weight:800;font-size:20px;color:var(--fg)}
.bundle .bd-was{display:inline-block;color:var(--muted);text-decoration:line-through;font-size:13px;margin:0 10px}
.bundle .bd-list .num{direction:ltr;unicode-bidi:isolate}
.bundle .bd-save{display:inline-flex;height:24px;align-items:center;padding:0 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:700}
@media (max-width:900px){.bundles{grid-template-columns:1fr}}

.annc{background:var(--fg);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:8px 12px;line-height:1.5}
/* ===== Photography: full-bleed cover images (SmartLine style) ===== */
.ph>img{object-fit:cover;object-position:center;padding:0;background:transparent}
.card .im{aspect-ratio:1/1}
.cat{padding:0;gap:0;align-items:stretch;border-radius:14px;overflow:hidden}
.cat .im{width:100%;height:auto;aspect-ratio:4/3;border-radius:0;border:0;background:var(--surface-2);display:block;position:relative}
.cat .im .ph{position:absolute;inset:0;display:block}
.cat:hover .im{box-shadow:none;background:var(--surface-2)}
.cat span:not(.im):not(.ph){display:block;padding:9px 6px 10px}
.cat:hover span{transform:none}
.hero .main .art.mosaic{
  display:grid;gap:8px;overflow:visible;background:none;border:0;box-shadow:none;border-radius:0;
  grid-template-columns:repeat(3,minmax(0,1fr));height:210px;min-height:210px;aspect-ratio:auto;max-width:none;
}
.tile{position:relative;display:block;border:0;padding:0;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--surface-2);min-height:0;box-shadow:var(--shadow-sm)}
.tile .ph{position:absolute;inset:0;display:block}
.tile .ph>img{transition:transform .4s ease}
.tile:hover .ph>img{transform:scale(1.05)}
.tile .tl{position:absolute;inset-inline:0;bottom:0;padding:26px 10px 10px;color:#fff;font-weight:800;font-size:15px;text-align:start;background:linear-gradient(180deg,transparent,rgba(23,21,20,.78))}
@media (min-width:901px){
  .hero .main .art.mosaic{
    grid-template-columns:1.15fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:auto;min-height:0;
    aspect-ratio:1/1;max-width:500px;border:0;box-shadow:none;border-radius:0;
  }
  .hero .main .art.mosaic .tile:first-child{grid-row:1 / span 2}
  .tile{border-radius:22px}
  .tile .tl{font-size:17px;padding:34px 16px 14px}
}

@media (min-width:641px){
 .row{grid-auto-columns:calc((100% - 36px)/4);gap:12px;overflow-y:hidden}

 .rnav:hover{background:#23211f;color:#fff}

 .rowwrap.can-l .rnav.l,.rowwrap.can-r .rnav.r{display:grid}

function enhanceRows(){
 document.querySelectorAll('#view .row').forEach(r=>{
  if(r.parentElement.classList.contains('rowwrap'))return;
  const w=document.createElement('div');w.className='rowwrap';r.parentNode.insertBefore(w,r);w.appendChild(r);
  const ar=S.lang==='ar';
  w.insertAdjacentHTML('beforeend',`<button type="button" class="rnav l" aria-label="${ar?'السابق':'Previous'}"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button type="button" class="rnav r" aria-label="${ar?'التالي':'Next'}"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>`);
  const upd=()=>{
   const max=r.scrollWidth-r.clientWidth-2,x=Math.abs(r.scrollLeft),rtl=getComputedStyle(r).direction==='rtl';
   const toLeft=rtl?x<max:x>2,toRight=rtl?x>2:x<max;
   w.classList.toggle('can-l',max>0&&toLeft);w.classList.toggle('can-r',max>0&&toRight);
  };
  r.addEventListener('scroll',upd,{passive:true});
  w.querySelector('.rnav.l').onclick=()=>r.scrollBy({left:-r.clientWidth*.9,behavior:'smooth'});
  w.querySelector('.rnav.r').onclick=()=>r.scrollBy({left:r.clientWidth*.9,behavior:'smooth'});
  window.addEventListener('resize',upd);
  setTimeout(upd,60);
 });
}

function msgModal(title,body){layer(`<div class="scrim" data-act="close"></div><div class="modal" role="dialog"><div class="box"><button class="xbtn" data-act="close" style="position:absolute;top:12px;inset-inline-end:12px" aria-label="×">×</button><h2 style="font-size:20px">${title}</h2>${body}</div></div>`);}
let toastT;function toast(m){clearTimeout(toastT);let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=m;el.hidden=false;toastT=setTimeout(()=>{el.hidden=true},2200);}

function addToCart(p,qty,sel,cfg,quiet){
 if(!p)return;
 const up=unitPrice(p,sel);const ins=p.type==='custom'&&cfg&&cfg.ins;
 const unit=Math.round(up*(ins?1.12:1)*100)/100;
 const opts=OPTS[p.cat]||[];
 let desc=opts.map(o=>S.lang==='ar'?o.v[(sel||{})[o.k]||0][0]:o.v[(sel||{})[o.k]||0][1]).join(' · ');
 if(p.type==='custom'&&p.unit==='m2')desc+=(desc?' · ':'')+`${cfg.w}×${cfg.h} cm`;
 if(ins)desc+=(desc?' · ':'')+(S.lang==='ar'?'مع التركيب':'with installation');
 const key=p.id+'|'+desc;
 const ex=S.cart.find(l=>l.key===key&&Number.isInteger(l.qty)&&Number.isInteger(qty));
 if(ex)ex.qty+=qty;else S.cart.push({key,id:p.id,qty,unit,desc,sel:Object.assign({},sel||{}),cfg:cfg&&p.type==='custom'?Object.assign({},cfg):null});
 save();updateCount();renderWaFab();
 if(!quiet)openCart();
}

function go(view,o){Object.assign(S,{view,mega:false},o||{});if(view==='list'){S.fCats=[];S.fType='all';S.fMax=500;S.sort='rel';}renderMega();renderTabbar();renderView();closeLayer();window.scrollTo(0,0);syncUrl();}

function prodState(id){const p=P.find(x=>x.id===id);const lc=p&&catOf(p.cat).id==='laser-cut-panels';return {pid:id,sel:{},qty:1,tab:'specs',img:0,cfg:{w:lc?120:200,h:lc?240:300,len:5,ins:false}};}
function urlFor(){const e=encodeURIComponent;
 if(S.view==='product'&&S.pid!=null)return '/p/'+S.pid;
 if(S.view==='list')return S.q?'/s/'+e(S.q):S.cat?'/c/'+e(S.cat):S.parent?'/d/'+e(S.parent):S.coll?'/k/'+e(S.coll):'/all';
 if(S.view==='checkout'||S.view==='account')return '/'+S.view;
 return '/';}
const BASE_TITLE=document.title;
function pageTitle(){const B=brand();const N=o=>o?(S.lang==='ar'?o.ar:o.en):'';
 if(S.view==='product'){const p=P.find(x=>x.id===S.pid);return p?N(p)+' | '+B:BASE_TITLE;}
 if(S.view==='list'){if(S.q)return (S.lang==='ar'?'بحث: ':'Search: ')+S.q+' | '+B;if(S.cat)return N(catOf(S.cat))+' | '+B;if(S.parent)return N(window.SL.PARENTS[S.parent])+' | '+B;return B;}
 if(S.view==='checkout')return (S.lang==='ar'?'إتمام الطلب':'Checkout')+' | '+B;
 if(S.view==='account')return (S.lang==='ar'?'حسابي':'My account')+' | '+B;
 return BASE_TITLE;}
function syncUrl(){if(S.view==='success')return;try{document.title=pageTitle();}catch(e){}const h=urlFor();if(location.pathname===h&&!location.hash)return;history.pushState(null,'',h);}
function readUrl(){let r=location.pathname;if(/^#\/[a-z]/.test(location.hash||'')){r=location.hash.slice(1);history.replaceState(null,'',r);}
 const m=r.match(/^\/([a-z]+)(?:\/(.+))?$/);if(!m)return ['home',{q:'',cat:null,parent:null,coll:null}];
 const v=m[2]?decodeURIComponent(m[2]):'';const L=o=>['list',Object.assign({q:'',cat:null,parent:null,coll:null},o)];
 switch(m[1]){case 'p':{const id=+v;return P.find(x=>x.id===id)?['product',prodState(id)]:['home',{}];}
  case 'c':return L({cat:v});case 'd':return L({parent:v});case 'k':return L({coll:v});case 's':return L({q:v});case 'all':return L({});
  case 'checkout':return S.cart.length?['checkout',{}]:['home',{}];case 'account':return ['account',{}];}
 return ['home',{}];}
function applyUrl(init){const [v,o]=readUrl();Object.assign(S,{view:v,mega:false},o);if(v==='list'){S.fCats=[];S.fType='all';S.fMax=500;S.sort='rel';}
 if(v==='account'&&S.user===null)S.myOrders=null;try{document.title=pageTitle();}catch(e){}if(init)return;renderMega();renderTabbar();renderView();closeLayer();window.scrollTo(0,0);}
window.addEventListener('popstate',()=>applyUrl(false));

document.addEventListener('change',e=>{

 else if(f==='type'){S.fType=el.value;renderView();}
 else if(f==='sort'){S.sort=el.value;renderView();}
 else if(el.dataset.cfg==='ins'){S.cfg.ins=el.checked;renderView();}
 else if(el.id==='pqty'){S.qty=Math.max(1,+el.value||1);renderView();}
 else if(el.name==='ship'){S.ship=el.value;renderView();}
 else if(el.name==='pay'){S.pay=el.value;}
 else if(el.id==='co-b2b'){S.b2b=el.checked;keepForm(()=>renderView());}
 else if(el.id==='co-terms'){S.terms=el.checked;}
 else if(el.id==='scope'){S.scope=el.value;}

async function placeOrder(){
 const need=['co-name','co-mob','co-dist'];let ok=true;
 need.forEach(id=>{const i=document.getElementById(id);if(!i.value.trim()){ok=false;i.style.borderColor='var(--sale)';}else i.style.borderColor='';});
 const mob=document.getElementById('co-mob');if(!isMobileOk(mob.value)){ok=false;mob.style.borderColor='var(--sale)';}
 const terms=document.getElementById('co-terms').checked;if(!terms)ok=false;
 const err=document.getElementById('co-err');if(!ok){err.textContent=t('req');err.hidden=false;return;}
 const v=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
 const body={lang:S.lang,ship:S.ship,pay:S.pay,terms:true,
  customer:{name:v('co-name'),mobile:v('co-mob'),email:v('co-mail'),city:v('co-city'),district:v('co-dist'),nat:v('co-nat'),b2b:S.b2b,company:v('co-co'),vat:v('co-vat'),cr:v('co-cr')},
  lines:S.cart.map(l=>({id:l.id,qty:l.qty,sel:l.sel||{},cfg:l.cfg||null}))};
 const btn=document.querySelector('[data-act=place]');btn.disabled=true;btn.textContent='…';
 try{
  const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){err.textContent=T[S.lang].errs[d.error]||T[S.lang].errs.generic;err.hidden=false;btn.disabled=false;btn.textContent=t('place');return;}
  try{localStorage.setItem('sl-last',JSON.stringify({no:d.orderNo,t:d.token}))}catch(x){}
  S.cart=[];S.terms=false;save();updateCount();
  if(d.redirect){location.href=d.redirect;return;}
  S.order=d.order;go('success');
 }catch(x){err.textContent=T[S.lang].errs.generic;err.hidden=false;btn.disabled=false;btn.textContent=t('place');}
}
async function loadOrderFromUrl(){

 history.replaceState(null,'',location.pathname);
}

const LM=k=>LMSG[S.lang][k];
const LP=()=>S.loginCh==='sms'?LM('p'):LM('pE');
const LE=(d)=>{const m=LMSG[S.lang].e[d&&d.error]||LMSG[S.lang].e.generic;return d&&d.error==='code_wrong'&&d.left!=null?m+(AR()?` (متبقي ${d.left} محاولات)`:` (${d.left} tries left)`):d&&d.error==='wait'&&d.retryIn?m+` (${d.retryIn}${LM('sec')})`:m;};
let loginTimer=null,otpAbort=null;
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{credentials:'same-origin'});let d={};try{d=await r.json();}catch(e){}return {ok:r.ok,d};}
async function loadMe(){try{const {ok,d}=await api('/api/auth/me');if(ok){S.user=d.user;S.loginOn=d.login;S.loginCh=d.channel||'email';renderHeader();if(S.user&&!S.user.name){let k=0;try{k=sessionStorage.getItem('sl-asked');sessionStorage.setItem('sl-asked','1');}catch(e){}if(!k&&!document.getElementById('layer').innerHTML)askName();}if(S.view==='account')renderView();}}catch(e){}}
function loginModal(step,mobile,resendIn,to,email){
 clearInterval(loginTimer);if(otpAbort){otpAbort.abort();otpAbort=null;}
 if(step!=='code'){
  msgModal(LM('t'),`<p class="muted" style="margin:0">${LP()}</p><form id="lgform" style="display:grid;gap:10px" novalidate><label class="field">${t('mobile')}<input id="lg-m" type="tel" inputmode="tel" autocomplete="tel" placeholder="05XXXXXXXX" value="${esc(mobile||'')}" dir="ltr" style="text-align:start;font-size:18px;letter-spacing:1px"></label>${S.loginCh==='sms'?'':`<label class="field">${LM('email')}<input id="lg-e" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" value="${esc(email||'')}" dir="ltr" style="text-align:start"><span class="muted" style="font-size:12px">${LM('emailHint')}</span></label>`}<p id="lg-err" style="color:var(--sale);margin:0;font-size:13px" hidden></p><button class="btn" type="submit">${LM('send')}</button></form>`);
  setTimeout(()=>{const i=document.getElementById('lg-m');if(i)i.focus();},50);return;
 }
 msgModal(LM('t'),`${to?`<p style="margin:0">${LM('sentToE')} <b dir="ltr" style="unicode-bidi:isolate">${esc(to)}</b></p><p class="muted" style="margin:0;font-size:12.5px">${LM('spam')}</p>`:`<p style="margin:0">${LM('sentTo')} <b class="num">${esc(mobile)}</b></p>`}<form id="lgcode" data-m="${esc(mobile)}" style="display:grid;gap:10px" novalidate><label class="field">${LM('code')}<input id="lg-c" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" dir="ltr" style="text-align:center;font-size:26px;letter-spacing:10px;font-variant-numeric:tabular-nums"></label><p id="lg-err" style="color:var(--sale);margin:0;font-size:13px" hidden></p><button class="btn" type="submit">${LM('verify')}</button><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px"><button type="button" class="link" id="lg-re" data-act="lgresend" data-m="${esc(mobile)}" data-e="${esc(email||'')}" disabled></button><button type="button" class="link" data-act="lgchange" data-m="${esc(mobile)}" data-e="${esc(email||'')}">${LM('change')}</button></div></form>`);
 let left=resendIn||60;const re=document.getElementById('lg-re');
 const tick=()=>{if(!document.getElementById('lg-re'))return clearInterval(loginTimer);if(left>0){re.disabled=true;re.textContent=`${LM('resendIn')} ${left}${LM('sec')}`;left--;}else{re.disabled=false;re.textContent=LM('resend');clearInterval(loginTimer);}};tick();loginTimer=setInterval(tick,1000);
 const ci=document.getElementById('lg-c');setTimeout(()=>ci&&ci.focus(),50);
 ci.addEventListener('input',()=>{ci.value=ci.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'').slice(0,6);if(ci.value.length===6)document.getElementById('lgcode').requestSubmit();});
 if('OTPCredential' in window){otpAbort=new AbortController();navigator.credentials.get({otp:{transport:['sms']},signal:otpAbort.signal}).then(o=>{if(o&&o.code&&document.getElementById('lg-c')){ci.value=o.code;document.getElementById('lgcode').requestSubmit();}}).catch(()=>{});}
}
async function loginSend(mobile,btn,email){
 const err=document.getElementById('lg-err');if(btn){btn.disabled=true;}
 const {ok,d}=await api('/api/auth/send',{mobile,email:email||'',lang:S.lang});
 if(btn)btn.disabled=false;
 if(ok){if(d.channel)S.loginCh=d.channel;loginModal('code',d.mobile,d.resendIn,d.to,email);return;}
 if(d.error==='email_required'&&!document.getElementById('lg-e')){S.loginCh='email';loginModal('mobile',mobile);const e2=document.getElementById('lg-err');if(e2){e2.textContent=LE(d);e2.hidden=false;}return;}
 if(d.error==='wait'&&document.getElementById('lgcode'))return;
 if(err){err.textContent=LE(d);err.hidden=false;}
}
function viewAccount(){
 if(!S.user)return `<div class="panel empty"><h2 style="font-size:20px">${LM('t')}</h2><p class="muted">${LP()}</p><button class="btn" data-act="signin">${LM('t')}</button></div>`;
 const st=T[S.lang].stName;const O=S.myOrders;
 return `<nav class="crumbs"><button data-act="home">${t('home')}</button><span>›</span><span>${LM('acc')}</span></nav>
 <div class="co"><section style="display:grid;gap:14px"><div class="panel step"><h3 style="font-size:18px">${LM('orders')}</h3>
  ${O==null?`<p class="muted" style="margin:0">…</p>`:O.length?`<div style="display:grid;gap:8px">${O.map(o=>`<button class="optc" data-act="myorder" data-no="${esc(o.no)}" data-t="${esc(o.t)}" style="text-align:start;cursor:pointer"><span class="grow"><b class="num">${esc(o.no)}</b><div class="sub">${esc(S.lang==='ar'?o.first.ar:o.first.en)}${o.items>1?` +${o.items-1}`:''} · ${new Date(o.created_at).toLocaleDateString(S.lang==='ar'?'ar-u-ca-gregory-nu-latn':'en-GB')}</div></span><span style="display:grid;justify-items:end;gap:4px"><b>${money(o.total)}</b><span class="chip">${esc(st[o.status]||o.status)}</span></span></button>`).join('')}</div>`:`<p class="muted" style="margin:0">${LM('noOrders')}</p>`}
 </div></section>
 <aside class="panel step"><h3 style="font-size:18px">${LM('acc')}</h3><div class="sum"><div><span>${t('mobile')}</span><b class="num">${esc(S.user.mobile)}</b></div></div>
  <form id="nmform" style="display:grid;gap:8px"><label class="field">${LM('name')}<input id="ac-name" value="${esc(S.user.name||'')}" autocomplete="name" maxlength="80"></label><button class="btn ghost" type="submit">${LM('save')}</button></form>
  <button class="btn dark" data-act="logout">${LM('logout')}</button></aside></div>`;
}
function askName(){msgModal(AR()?'أهلاً بك في كنوز الحقول':'Welcome to Knooz',`<p class="muted" style="margin:0">${AR()?'اكتب اسمك عشان نظهره في حسابك.':'Tell us your name for your account.'}</p><form id="nmask" style="display:grid;gap:10px"><label class="field">${LM('name')}<input id="nm-ask" autocomplete="name" maxlength="80" required></label><button class="btn" type="submit">${LM('save')}</button></form>`);setTimeout(()=>{const i=document.getElementById('nm-ask');if(i)i.focus();},60);}
async function loadMyOrders(){const {ok,d}=await api('/api/auth/orders');S.myOrders=ok?d:[];if(S.view==='account')renderView();}
/* ---------- installable app (PWA: phone + desktop) ---------- */
let instEvt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isMobileDev=/android|iphone|ipad|ipod|mobile|silk|opera mini/i.test(navigator.userAgent)||isIOS;
const instDismissed=()=>{try{return Date.now()-(+localStorage.getItem('sl-inst-x')||0)<3*864e5}catch(e){return false}};
function hideInstall(){const b=document.getElementById('instbar');if(b)b.remove();}
function showInstall(force){
 if(isStandalone()||document.getElementById('instbar'))return;
 if(!force&&instDismissed())return;
 if(!force&&!instEvt&&!isIOS)return;
 const ar=S.lang==='ar';
 const title=ar?'ثبّت كنوز الحقول كتطبيق':'Install Knooz as an app';
 const sub=isMobileDev
  ?(ar?'أيقونة على شاشتك الرئيسية — تفتح بدون متصفح':'Home-screen icon — opens without the browser chrome')
  :(ar?'يفتح كنافذة تطبيق على جهازك (ويندوز / ماك)':'Opens as an app window on your computer (Windows / Mac)');
 const d=document.createElement('div');d.id='instbar';d.className='instbar'+(isMobileDev?'':' desktop');d.setAttribute('role','dialog');
 d.innerHTML=`<img src="/assets/mark.png" alt="كنوز الحقول"><div class="tx"><b>${title}</b><span>${sub}</span></div><button class="btn alt" data-act="install">${ar?'تثبيت':'Install'}</button><button class="x" data-act="instx" aria-label="${ar?'إغلاق':'Close'}">×</button>`;
 document.body.appendChild(d);
}
function installSteps(){
 const ar=S.lang==='ar';
 const share='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>';
 const dots='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
 let st;
 if(isIOS){
  st=ar
   ?[`افتح الموقع في <b>Safari</b>`,`اضغط زر المشاركة ${share}`,`اختر <b>إضافة إلى الشاشة الرئيسية</b>`,`اضغط <b>إضافة</b>`]
   :[`Open the site in <b>Safari</b>`,`Tap Share ${share}`,`Choose <b>Add to Home Screen</b>`,`Tap <b>Add</b>`];
 }else if(isMobileDev){
  st=ar
   ?[`افتح قائمة المتصفح ${dots}`,`اختر <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>`,`اضغط <b>تثبيت</b>`]
   :[`Open the browser menu ${dots}`,`Choose <b>Install app</b> or <b>Add to Home screen</b>`,`Tap <b>Install</b>`];
 }else{
  st=ar
   ?[`في <b>Chrome</b> أو <b>Edge</b>: اضغط أيقونة التثبيت في شريط العنوان`,`أو من القائمة ${dots} اختر <b>تثبيت كنوز الحقول…</b>`,`بعد التثبيت يفتح كتطبيق مستقل على سطح المكتب`]
   :[`In <b>Chrome</b> or <b>Edge</b>: click the install icon in the address bar`,`Or open the menu ${dots} and choose <b>Install Knooz…</b>`,`After install it opens as a standalone desktop app`];
 }
 msgModal(ar?'تثبيت كنوز الحقول كتطبيق':'Install Knooz as an app',`<ol class="isteps">${st.map(x=>`<li>${x}</li>`).join('')}</ol><button class="btn" data-act="close" style="width:max-content">${ar?'تمام':'OK'}</button>`);
}
async function promptInstall(){
 if(instEvt){
  instEvt.prompt();
  try{await instEvt.userChoice;}catch(x){}
  instEvt=null;hideInstall();return;
 }
 installSteps();
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;setTimeout(()=>showInstall(),3500);});
if(isIOS)window.addEventListener('load',()=>setTimeout(()=>showInstall(),6000));
window.addEventListener('appinstalled',()=>{instEvt=null;hideInstall();toast(S.lang==='ar'?'تم تثبيت التطبيق':'App installed');});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act=install],[data-act=instx]');
 if(!b)return;
 if(b.dataset.act==='instx'){try{localStorage.setItem('sl-inst-x',String(Date.now()))}catch(x){}hideInstall();return;}
 promptInstall();
});
if('serviceWorker' in navigator){
 const canSW=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
 if(canSW)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
try{sessionStorage.setItem('knz-intro','1');}catch(e){}
const introEl=document.getElementById('intro');if(introEl){introEl.hidden=true;introEl.innerHTML='';}
applyUrl(true);renderHeader();renderMega();renderTabbar();renderView();renderCreditRail();renderWaFab();
if(S.view==='account'&&typeof loadMyOrders==='function')setTimeout(()=>{if(S.user)loadMyOrders();},800);loadOrderFromUrl();loadMe();
})();
</script>
